interface:
  display_name: "Generic CDN Writing"
  short_description: "适配知乎、GitHub 与 SEO 博客的 CDN 技术写作"
  default_prompt: "使用 $generic-cdn-writing。调用只启动分阶段流程，不授权直接生成全文。先交付 Brief 并等待用户确认，再交付带 Claim ID 的论点大纲并等待确认；逐声明完成信源审计并再次等待确认，前三关通过后才写初稿。初稿和终稿也分别等待确认。知乎与 SEO 博客使用普通、自然的中文，少用黑话和无序列表；不得虚构实测、数据、报价或独立背书。"
policy:
  allow_implicit_invocation: true
